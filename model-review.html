<!doctype html><html><body style="margin:0"><select id="model" style="position:fixed;z-index:3;padding:12px"><option value="loft_interior_6_for_free">Loft</option><option value="tiny_isometric_room">Tiny</option></select><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/examples/jsm/loaders/GLTFLoader.js';import{OrbitControls}from'three/examples/jsm/controls/OrbitControls.js';
const s=new T.Scene();s.background=new T.Color('#b9b4ab');const c=new T.PerspectiveCamera(48,innerWidth/innerHeight,.01,5000),r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(1);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;document.body.append(r.domElement);s.add(new T.HemisphereLight(0xffffff,0x8c8174,2));const l=new T.DirectionalLight(0xffe9cc,3);l.position.set(10,20,10);s.add(l);const ctl=new OrbitControls(c,r.domElement);let root;async function load(){if(root)s.remove(root);const g=await new GLTFLoader().loadAsync('/assets/'+document.querySelector('select').value+'.glb');root=g.scene;root.traverse(o=>{if(o.name.includes('Sphere')||o.name.includes('ray_lowpoly'))o.visible=false});s.add(root);const b=new T.Box3();root.traverse(o=>{if(o.isMesh&&o.visible)b.union(new T.Box3().setFromObject(o))});const mid=b.getCenter(new T.Vector3()),size=b.getSize(new T.Vector3()).length();ctl.target.copy(mid);c.position.copy(mid).add(new T.Vector3(.7,.55,.9).multiplyScalar(size));c.far=size*10;c.updateProjectionMatrix();ctl.update()}document.querySelector('select').onchange=load;await load();r.setAnimationLoop(()=>{ctl.update();r.render(s,c)});
</script></body></html>
