<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#176b68" />
  <meta name="referrer" content="no-referrer" />
  
  <title>小岛专属邀请 · 送给特别的你</title>
  <meta name="description" content="这是一份特别为你准备的小岛礼物。在碧蓝浅滩驾驶小船，登岛开启属于你的海岛小屋与美好回忆。" />

  <!-- Favicon 系列 (全尺寸与各端适配) -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="mask-icon" href="/favicon.svg" color="#176b68" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="msapplication-TileColor" content="#176b68" />
  <meta name="msapplication-TileImage" content="/favicon-192x192.png" />

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    if (typeof window !== 'undefined' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      var s = document.createElement('script');
      s.defer = true;
      s.src = '/_vercel/insights/script.js';
      document.head.appendChild(s);
    }
  </script>

  <!-- 微信与 QQ 抓取配置 (itemprop 优先) -->
  <meta itemprop="name" content="小岛专属邀请 · 送给特别的你" />
  <meta itemprop="description" content="这是一份特别为你准备的小岛礼物。在碧蓝浅滩驾驶小船，登岛开启属于你的海岛小屋与美好回忆。" />
  <meta itemprop="image" content="https://island.fde.fan/share-wechat.jpg" />

  <!-- Open Graph 协议 (适配 WhatsApp, Instagram, Telegram, Facebook 等) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="The Atoll" />
  <meta property="og:title" content="小岛专属邀请 · 送给特别的你" />
  <meta property="og:description" content="这是一份特别为你准备的小岛礼物。在碧蓝浅滩驾驶小船，登岛开启属于你的海岛小屋与美好回忆。" />
  <meta property="og:url" content="https://island.fde.fan/gift" />
  
  <!-- WhatsApp 优先：800x800 正方形 (< 300KB，聊天气泡无裁切) -->
  <meta property="og:image" content="https://island.fde.fan/share-whatsapp.jpg" />
  <meta property="og:image:secure_url" content="https://island.fde.fan/share-whatsapp.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="800" />
  <meta property="og:image:height" content="800" />
  <meta property="og:image:alt" content="小岛专属邀请 · 送给特别的你" />

  <!-- 通用宽屏 Open Graph 图 (1200x630) -->
  <meta property="og:image" content="https://island.fde.fan/share-og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="小岛专属邀请 · 送给特别的你" />
  <meta name="twitter:description" content="这是一份特别为你准备的小岛礼物。在碧蓝浅滩驾驶小船，登岛开启属于你的海岛小屋与美好回忆。" />
  <meta name="twitter:image" content="https://island.fde.fan/share-og.jpg" />
  <meta name="twitter:image:alt" content="小岛专属邀请 · 送给特别的你" />

  <!-- 确保分享图片绝对路径脚本 (兼容多环境部署与爬虫) -->
  <script>
    (function() {
      try {
        if (typeof window !== 'undefined' && window.location && window.location.origin) {
          var origin = window.location.origin;
          var metaImages = document.querySelectorAll('meta[property="og:image"], meta[property="og:image:secure_url"], meta[name="twitter:image"], meta[itemprop="image"]');
          metaImages.forEach(function(m) {
            if (m && m.content && !m.content.startsWith('http')) {
              m.content = origin + (m.content.startsWith('/') ? '' : '/') + m.content;
            }
          });
        }
      } catch (e) {}
    })();
  </script>

  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <!-- 微信、朋友圈、WhatsApp、Instagram 爬虫抓取图片集合 (正方形与高清海报) -->
  <div style="display:none;position:absolute;width:0;height:0;overflow:hidden;opacity:0;" aria-hidden="true">
    <img src="/share-wechat.jpg" width="600" height="600" alt="微信分享图" />
    <img src="/share-moments.jpg" width="1080" height="1080" alt="朋友圈分享图" />
    <img src="/share-whatsapp.jpg" width="800" height="800" alt="WhatsApp 分享图" />
    <img src="/share-instagram.jpg" width="1080" height="1080" alt="Instagram 帖子图" />
    <img src="/share-instagram-story.jpg" width="1080" height="1920" alt="Instagram 故事图" />
  </div>

  <div id="stage" aria-label="小岛场景。点击海面或使用方向键驾驶小船。"></div>
  <div id="gift-root"></div>
  <div id="status" class="status" role="status">正在准备小岛…</div>
</body>
</html>
